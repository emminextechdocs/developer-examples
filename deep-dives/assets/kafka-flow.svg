<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">Kafka: commit a resume position, not a completed record</title><desc id="desc">The log still contains the two original records; replay does not require another publish. Manual assignment isolates offset behavior. Rebalances are outside this fixture.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#176B55"/></marker></defs><rect width="1440" height="610" fill="#F5F6F2"/><g font-family="Arial,Helvetica,sans-serif"><text x="64" y="62" font-size="17" fill="#176B55" letter-spacing="1.5">EMMINEX TECHDOCS · TECHNICAL WALKTHROUGH</text><text x="64" y="114" font-size="31" font-weight="600" fill="#17211D">Kafka: commit a resume position, not a completed record</text><rect x="64" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="84" y="231" font-size="16" fill="#176B55">01</text><text x="84" y="266" font-size="20" fill="#17211D">Read offset 0</text><line x1="347" y1="269" x2="389" y2="269" stroke="#176B55" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="420" y="231" font-size="16" fill="#176B55">02</text><text x="420" y="266" font-size="20" fill="#17211D">Close without commit</text><line x1="683" y1="269" x2="725" y2="269" stroke="#176B55" stroke-width="3" marker-end="url(#arrow)"/><rect x="736" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="756" y="231" font-size="16" fill="#176B55">03</text><text x="756" y="266" font-size="20" fill="#17211D">Replay offset 0; commit</text><text x="756" y="292" font-size="20" fill="#17211D">1</text><line x1="1019" y1="269" x2="1061" y2="269" stroke="#176B55" stroke-width="3" marker-end="url(#arrow)"/><rect x="1072" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="1092" y="231" font-size="16" fill="#176B55">04</text><text x="1092" y="266" font-size="20" fill="#17211D">New consumer reads</text><text x="1092" y="292" font-size="20" fill="#17211D">offset 1</text><rect x="64" y="389" width="1312" height="94" rx="12" fill="#E2F0EA"/><text x="88" y="427" font-size="21" fill="#0D4D3D">The log still contains the two original records; replay does not require another publish</text><text x="64" y="539" font-size="18" fill="#5D6964">Manual assignment isolates offset behavior. Rebalances are outside this fixture.</text></g></svg>