<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">OpenTelemetry: redaction must target the right context</title><desc id="desc">Corrected export: all tested sensitive values absent; customer.tier retained. This proves the tested fields are removed. Other signals and free text need their own tests.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#176B55"/></marker></defs><rect width="1440" height="610" fill="#F5F6F2"/><g font-family="Arial,Helvetica,sans-serif"><text x="64" y="62" font-size="17" fill="#176B55" letter-spacing="1.5">EMMINEX TECHDOCS · TECHNICAL WALKTHROUGH</text><text x="64" y="114" font-size="31" font-weight="600" fill="#17211D">OpenTelemetry: redaction must target the right context</text><rect x="64" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="84" y="231" font-size="16" fill="#176B55">01</text><text x="84" y="266" font-size="20" fill="#17211D">OTLP trace fixture</text><line x1="347" y1="269" x2="389" y2="269" stroke="#176B55" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="420" y="231" font-size="16" fill="#176B55">02</text><text x="420" y="266" font-size="20" fill="#17211D">Span and resource</text><text x="420" y="292" font-size="20" fill="#17211D">deletion</text><line x1="683" y1="269" x2="725" y2="269" stroke="#176B55" stroke-width="3" marker-end="url(#arrow)"/><rect x="736" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="756" y="231" font-size="16" fill="#176B55">03</text><text x="756" y="266" font-size="20" fill="#17211D">First run: event email</text><text x="756" y="292" font-size="20" fill="#17211D">survives</text><line x1="1019" y1="269" x2="1061" y2="269" stroke="#176B55" stroke-width="3" marker-end="url(#arrow)"/><rect x="1072" y="200" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#89958F"/><text x="1092" y="231" font-size="16" fill="#176B55">04</text><text x="1092" y="266" font-size="20" fill="#17211D">Second run: event</text><text x="1092" y="292" font-size="20" fill="#17211D">transform</text><rect x="64" y="389" width="1312" height="94" rx="12" fill="#E2F0EA"/><text x="88" y="427" font-size="21" fill="#0D4D3D">Corrected export: all tested sensitive values absent; customer.tier retained</text><text x="64" y="539" font-size="18" fill="#5D6964">This proves the tested fields are removed. Other signals and free text need their own tests.</text></g></svg>