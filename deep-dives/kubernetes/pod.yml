apiVersion: v1
kind: Pod
metadata:
  name: draining-app
  labels: {app: draining-app}
spec:
  terminationGracePeriodSeconds: 20
  restartPolicy: Never
  containers:
    - name: app
      image: python:3.13.7-alpine
      command: [python, /app/app.py]
      ports: [{containerPort: 8080}]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 500m, memory: 128Mi}
      readinessProbe:
        httpGet: {path: /ready, port: 8080}
        periodSeconds: 1
        failureThreshold: 1
      livenessProbe:
        httpGet: {path: /live, port: 8080}
        periodSeconds: 5
      lifecycle:
        preStop:
          exec:
            command:
              - python
              - -c
              - "import urllib.request,time; urllib.request.urlopen('http://127.0.0.1:8080/drain').read(); time.sleep(2)"
      volumeMounts: [{name: app, mountPath: /app, readOnly: true}]
  volumes:
    - name: app
      configMap: {name: draining-app}
---
apiVersion: v1
kind: Service
metadata:
  name: draining-app
spec:
  selector: {app: draining-app}
  ports: [{port: 8080, targetPort: 8080}]
